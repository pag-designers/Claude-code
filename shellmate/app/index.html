/Users/kip/projects`},{title:`Four commands to find your way`,body:'Your computer is a tree of **folders**. The terminal is always standing *inside* one of them.\n\n`pwd` answers "where am I?" (it prints the current folder). `ls` answers "what\'s here?" (it lists files and folders). `cd folder` means "go into that folder". `cd ..` means "go up one level", back to the parent folder.\n\nA **project** is nothing magic: it\'s just a folder full of files. In the example, anything after `#` is a note for humans; the terminal ignores it.',code:`$ pwd          # where am I?
/Users/kip
$ ls           # what's here?
projects  notes.md
$ cd projects  # go into projects
$ cd ..        # go back up`},{title:`Inside Claude Code the prompt changes`,body:'When you start Claude Code (by typing `claude`), you\'re now *talking to Claude*, and the prompt looks like `>` instead of `$`.\n\nAt the `>` prompt you type **plain English** ("explain this project") or **slash commands** that start with `/`, like `/help`.\n\nRule of thumb: `$` = the shell, which wants commands like `ls`. `>` = Claude, which understands sentences.',code:`$ claude
> explain this project
> /help`}],exercises:[{id:`u0-l1-e1`,type:`multiple-choice`,prompt:"Your terminal shows `$` with a blinking cursor. What does the `$` mean?",options:[`You owe money`,`Ready, type your command here`,`An error happened`,`You must type a $ before every command`],answer:1,explanation:`The $ is the prompt: the terminal is waiting for you, and it's already printed so you never type it yourself.`},{id:`u0-l1-e2`,type:`match-pairs`,prompt:`Match each command to what it does.`,pairs:[{left:`pwd`,right:`Where am I?`},{left:`ls`,right:`What's here?`},{left:`cd projects`,right:`Go into projects`},{left:`cd ..`,right:`Go up one folder`}],explanation:`These four commands let you look around and move between folders, which is all the navigation you need to start.`},{id:`u0-l1-e3`,type:`spot-bad-prompt`,prompt:"The terminal shows `$`. You want to list what's in this folder. Which one do you type?",options:[`$ ls`,`ls`],better:1,explanation:`The $ is already on screen as the prompt, so you type only the command itself: ls.`},{id:`u0-l1-e4`,type:`multiple-choice`,prompt:"You started Claude Code and now see a `>` prompt. What can you type there?",options:[`Only shell commands like ls and pwd`,`Nothing, you must wait`,`Plain English, or slash commands like /help`,`Only numbers`],answer:2,explanation:`The > prompt means you're talking to Claude, which understands sentences and slash commands instead of shell commands.`},{id:`u0-l1-e5`,type:`fill-blank`,prompt:`Complete Kip's tour: check where you are, list what's here, then go up one folder.`,code:`$ ___

└─┬──┘ └───┬────┘
 command    flag`},{title:`Flags: long, short, and with values`,body:'Flags come in two forms that usually mean the same thing:\n\n**Long form**: two dashes and a word, like `--continue`. Easy to read.\n\n**Short form**: one dash and one letter, like `-c`. Quick to type.\n\nSome flags need a **value** right after them: in `--output-format json`, the flag is `--output-format` and its value is `json`.\n\nIf an argument has **spaces**, wrap it in **double quotes** so it stays one piece: `claude "explain this project"` gives Claude the whole sentence as one task.',code:`claude --continue     # long form
claude -c             # short form, same thing
claude --output-format json
claude "explain this project"`},{title:`Paths and file types`,body:"A **path** is an address for a file. Slashes separate folders: `src/app.ts` means the file `app.ts` inside the folder `src`.\n\nShortcuts: `~` means **your home folder**, `.` means **the current folder**, and `..` (you met it already) means the folder above.\n\nThe ending of a file name is its **extension** and hints what's inside: `.md` = Markdown notes, `.json` = settings data, `.ts` / `.js` = code, `.sh` = a shell script (a list of commands).",code:`src/app.ts           # app.ts inside the src folder
~/projects           # projects in your home folder
./CLAUDE.md          # CLAUDE.md in the current folder

- Run tests before committing
- Use 2-space indentation`},{title:`JSON: labeled boxes of settings`,body:'Settings live in `.claude/settings.json`, written in **JSON**. The rules are strict, but there are only a few:\n\nCurly braces `{ }` hold **key/value pairs**. The **key** is the label, always in **double quotes**. A **colon** `:` sits between key and value. **Commas** go *between* pairs, but **never after the last one** (no trailing comma).\n\nText values (called **strings**) are in double quotes too, like `"dark"`. Square brackets `[ ]` hold a **list**, with commas between items.',code:`{
  "theme": "dark",
  "allow": ["Read", "Edit"]
}`},{title:`You read, steer and check`,body:"A value can itself be another `{ }` box. Just read it from the outside in: here `permissions` holds `allow`, which holds a list.\n\nGood news: you're **not expected to write code from scratch**. In Claude Code, **Claude writes the code**. Your job is to **ask** in plain English, **read** what it changed, **steer** it if something's off, and **check** that it works.\n\nKnowing what `{ }`, `[ ]` and `#` mean is enough to follow along. Kip believes in you.",code:`{
  "permissions": {
    "allow": ["Read", "Edit"]
  }
}`}],exercises:[{id:`u0-l3-e1`,type:`multiple-choice`,prompt:"In a Markdown file, what is the line `# Project notes`?",options:[`A comment that Claude ignores`,`A heading`,`A bullet in a list`,`A JSON key`],answer:1,explanation:`In Markdown, # followed by a space turns the line into a heading.`},{id:`u0-l3-e2`,type:`match-pairs`,prompt:`Match each symbol to its job.`,pairs:[{left:`{ }`,right:`Holds key/value pairs`},{left:`[ ]`,right:`Holds a list`},{left:`:`,right:`Between key and value`},{left:`,`,right:`Between pairs or items`},{left:`- (Markdown)`,right:`A bullet point`}],explanation:`Each symbol has one small job, and recognizing them is most of what reading JSON and Markdown takes.`},{id:`u0-l3-e3`,type:`spot-bad-prompt`,prompt:`Which settings snippet is valid JSON?`,options:[`{ "theme": "dark", }`,`{ "theme": "dark" }`],better:1,explanation:`JSON forbids a comma after the last pair, so the trailing comma makes the first one invalid.`},{id:`u0-l3-e4`,type:`multiple-choice`,prompt:`Which of these is a correct JSON key/value pair?`,options:[`theme: dark`,`'theme': 'dark'`,`"theme": "dark"`,`"theme" = "dark"`],answer:2,explanation:`JSON keys and text values use double quotes, with a colon in between.`},{id:`u0-l3-e5`,type:`fill-blank`,prompt:`Complete this settings file.`,code:`___

ude's replies, files it read, command output, and \`CLAUDE.md\`) piles into the **context window**: Claude's working memory. It's big, but finite, and it's measured in **tokens** (small chunks of text).

As a session runs long, old and irrelevant content **crowds out** what matters now. Typical drift: one focused task → an unrelated side task → piles of logs and files → stale details → less focused answers. Every turn also costs more tokens.

dd the `--permission-mode` flag and the mode name `plan`. Both spellings work:\n`claude --permission-mode plan`\n`claude --permission-mode=plan`",code:`# program  flag               value
claude    --permission-mode  plan`},{title:`Switching modes with Shift+Tab`,body:"Already in a session? Press `Shift+Tab` to cycle permission modes. The indicator under the prompt shows where you are:\n• **Manual** (`default`): asks before edits and commands\n• **accept edits** (`acceptEdits`): auto-approves file edits\n• **plan** (`plan`): explores read-only and proposes a plan\nThere is also `bypassPermissions`, which skips prompts entirely and belongs only in containers or VMs (more next lesson).\n\nA typical plan-mode flow: switch to plan → describe the change → Claude explores and proposes a plan → you ask questions and refine it → you approve → Claude edits → you review the diffs."},{title:`Make plan mode the default`,body:'Want every session in a project to start in plan mode? Put this in the project settings file `.claude/settings.json`:\n• `"permissions"` is the section for permission settings; its `{ }` holds the options.\n• `"defaultMode"` is the exact key name (camelCase) for the mode sessions start in.\n• `"plan"` is the value: a mode name, written as a JSON string in double quotes.\n\nSwap the value for `"acceptEdits"` or `"default"` to start in those modes instead.',code:`{

nd refine the plan`,`Approve the plan so Claude can start editing`,`Review the resulting diffs`],explanation:`Refining and approving the plan before any edit means mistakes are caught while they are still cheap words, not code.`},{id:`u5-l1-e7`,type:`fill-blank`,prompt:`Make every session in this project start in plan mode.`,code:`{

hing, publishing like `npm publish`) **still ask**. It is perfect when you are iterating on code you'll review in the diff anyway. Start in it with the same flag as plan mode, just a different value. The value is case-sensitive camelCase: `acceptEdits`.",code:`claude --permission-mode acceptEdits`},{title:`Cycling and the danger zone`,body:"`Shift+Tab` moves one step each press: Manual (`default`) → `acceptEdits` → `plan`, and, when they are available, `bypassPermissions` and `auto` as well. So from Manual, one press gives accept edits and a second press gives plan. Watch the indicator under the prompt.\n\n`--dangerously-skip-permissions` starts in `bypassPermissions`, which skips **all** permission prompts. Kip only uses it inside an isolated **container or VM**, never on a laptop with real credentials.",code:`claude --dangerously-skip-permissions   # sandbox only!`},{title:`Your control panel`,body:"Three kinds of controls, three moments:\n• **Flags** pick the mode when you launch `claude`.\n• **Shift+Tab** switches modes mid-session.\n• `/permissions` (typed inside a session) shows and edits your allow, ask and deny rules. You'll write those rules in the next lesson.",code:`claude --permission-mode default       # Manual: asks first

sions` to see every rule and which file it came from.",code:`> /permissions`},{title:`The three lists`,body:'Rules go in three lists inside `"permissions"`:\n• `"allow"`: runs **without asking**.\n• `"ask"`: always **asks you first**.\n• `"deny"`: **blocked**, never runs.\n\nEach list is a JSON array `[ ]` of rule strings in double quotes, separated by commas. In this example tests and the docs folder are free, `git push` needs a yes, and `.env` and `curl` are off-limits.',code:`{

ion mode (for example, Manual asks).\n\nSo with this config, `git status` runs freely, `git push origin main` asks, and `rm -rf build` is blocked. An allow rule can never carve an exception out of a deny rule.",code:`{

ands of lines of output`,`Fixing a one-character typo in the file you are already editing`],answer:3,explanation:`A separate context only pays off for big or noisy work, so a tiny local edit just gains overhead.`},{id:`u7-l1-e7`,type:`order-steps`,prompt:`Put the delegation flow in order.`,steps:[`You ask for a broad investigation`,`Claude picks a subagent based on its description`,`The subagent works in its own context window`,`The subagent returns a summary`,`The main conversation continues with just the summary`],explanation:`Only the summary comes back, which is exactly why delegation keeps your main context small.`},{id:`u7-l1-e5`,type:`terminal`,prompt:`Inside a session, type the slash command for managing subagents.`,promptSymbol:`>`,accepted:[`/agents`],hint:`Pattern: / + the plural of "agent".`,explanation:"`/agents` is the entry point for subagents: recent versions point you to asking Claude or editing `.claude/agents/`, older ones open a manager."},{id:`u7-l1-e8`,type:`prompt-workshop`,scenario:`Before upgrading from React 18 to 19, you want two things investigated at the same time: usage of deprecated APIs and how well the components are covered by tests.`,files:[`package.json`,`src/components/`],sample:`We're upgrading from React 18 to 19 (see @package.json). Use two subagents in parallel. One: search @src/components/ for APIs deprecated or removed in React 19 (e.g. string refs, legacy context, defaultProps on function components) and list file:line hits. Two: report which components in @src/components/ have no tests. Constraint: do not edit anything. Done when you combine both into a short upgrade-risk report ranked by risk.`,keywords:[`subagent`,`parallel`,`React 19`,`deprecated`,`tests`,`report`],explanation:`Giving context, independent tasks, scope and the combined deliverable lets the subagents work in parallel without overlap.`}]},{id:`u7-l2`,title:`Write Your Own Agent`,description:`Agent files, frontmatter and tools`,theory:[{title:`Anatomy of an agent file`,body:"A custom subagent is a Markdown file: `.claude/agents/<name>.md` (project, commit it to share) or `~/.claude/agents/<name>.md` (personal). Like commands and skills, it starts with **YAML frontmatter** between `---` lines (`key: value` per line), and the **body below is the agent's system prompt**.\n• `name:` unique identifier (required)\n• `description:` when Claude should delegate to it (required)\n• `tools:` comma-separated list of allowed tools (optional; **omit it and the agent inherits every tool** available to subagents)\n• `model:` `sonnet`, `opus`, `haiku` or `inherit` (optional)",code:`---

        "hooks": [

        ]
      }
    ]
  }
}`},{title:`What the hook receives`,body:"Claude Code sends your command a JSON description of the event on **stdin** (the input piped into it), with fields like `tool_name` and `tool_input`. For Edit and Write, `tool_input.file_path` is the file that changed.\n\nIn the Prettier hook, `jq -r '.tool_input.file_path'` pulls out that path, and `| xargs npx prettier --write` passes it to Prettier.\n\nInside a session, type `/hooks` to browse the hooks you have configured.",code:`# what arrives on stdin (simplified)
{

tsheet:hp},_p=s({cheatsheet:()=>Sp,color:()=>yp,default:()=>Cp,description:()=>vp,id:()=>`u9`,lessons:()=>bp,mission:()=>xp,order:()=>9,title:()=>`MCP`}),vp=`Plug Claude into GitHub, databases, browsers and more with the Model Context Protocol.`,yp=`#7c8cff`,bp=[{id:`u9-l1`,title:`What Is MCP?`,description:`Servers that give Claude new tools`,theory:[{title:`A universal plug for tools`,body:`**MCP** stands for **Model Context Protocol**: an open standard for connecting AI tools like Claude Code to external systems and data.

An **MCP server** is a small program that exposes **tools** Claude can call. Connect the GitHub server and Claude can read issues and open PRs. Connect a database server and it can query your tables. Connect Playwright and it can drive a real browser.

Every tool gets a name in the pattern \`mcp__<server>__<tool>\`: the word \`mcp\`, the server's name, the tool's name, joined by **two** underscores. You'll see these names in Claude's output and in permission rules.

Kip's take: MCP is like bolting new limbs onto the shell. Same crab, many more claws.`,code:`# server named "github", tool named "list_issues"
mcp__github__list_issues

# server named "db", tool named "query"
mcp__db__query`},{title:`Local vs remote servers`,body:`How Claude talks to a server is called its **transport**. You'll type these names in lowercase:

\`stdio\` ("standard input/output"): the server runs as a **local** program on your machine, started by a command such as \`npx ...\`. Claude talks to it through that program's input and output.

\`http\`: the server lives at a **URL** on the internet. This is the recommended option for remote services. The older \`sse\` transport is deprecated, so avoid it.

Only add servers you trust. A server that fetches outside content (web pages, issues, emails) could hand Claude hidden instructions written by someone else. That attack is called **prompt injection**.`,code:`stdio -> local program on your machine
http  -> remote server at a URL (recommended for remote)
sse   -> old remote transport, deprecated`}],exercises:[{id:`u9-l1-e1`,type:`multiple-choice`,prompt:`What does MCP stand for?`,options:[`Model Context Protocol`,`Multi-Command Pipeline`,`Managed Code Plugin`,`Machine Control Process`],answer:0,explanation:`MCP is the Model Context Protocol: a shared standard, so any tool that speaks it can plug into Claude the same way.`},{id:`u9-l1-e2`,type:`multiple-choice`,prompt:`What does connecting an MCP server give Claude?`,options:[`A faster model`,`New tools and data sources from an external system`,`A bigger context window`,`Automatic git commits`],answer:1,explanation:`A server adds tools, not intelligence: it gives Claude new actions it can take in an outside system.`},{id:`u9-l1-e3`,type:`match-pairs`,prompt:`Match each MCP server to what it lets Claude do.`,pairs:[{left:`GitHub server`,right:`Read issues, open PRs`},{left:`Database server`,right:`Query your tables`},{left:`Playwright server`,right:`Drive a real browser`},{left:`Notion server`,right:`Read and update docs`}],explanation:`Each server plugs Claude into one external system, so you add the server for whichever system you need Claude to reach.`},{id:`u9-l1-e5`,type:`multiple-choice`,prompt:`You're connecting to a remote MCP server hosted at a URL. Which transport is recommended?`,options:[`sse`,`stdio`,`http`,`ssh`],answer:2,explanation:`HTTP is the recommended transport for remote servers because SSE is deprecated and stdio only works for programs on your own machine.`},{id:`u9-l1-e6`,type:`multiple-choice`,prompt:"Tools from an MCP server named `github` appear to Claude with names like…",options:[`github.create_issue()`,`mcp__github__create_issue`,`/github create_issue`,`github::create_issue`],answer:1,explanation:`MCP tools follow mcp__<server>__<tool> so tools from different servers never clash, and you use the same name in permission rules.`},{id:`u9-l1-e8`,type:`multiple-choice`,prompt:`Why should you only add MCP servers you trust?`,options:[`Untrusted servers make Claude slower`,`Servers that fetch outside content can expose you to prompt injection`,`Claude can only connect to one server at a time`,`Untrusted servers delete your CLAUDE.md`],answer:1,explanation:`Content a server pulls in could contain instructions written by a stranger, so a server is only as safe as what it fetches.`},{id:`u9-l1-e7`,type:`spot-bad-prompt`,prompt:`The GitHub MCP server is connected. You want help with issue #142 in acme/web.`,options:[`Fix the issue.`,`Use the GitHub MCP server to read issue #142 in acme/web, summarize the bug, then propose a fix for src/cart.ts. Don't edit anything yet.`],better:1,explanation:`Naming the server, repo, issue and file tells Claude which tool to call and where to look, instead of guessing.`},{id:`u9-l1-e4`,type:`fill-blank`,prompt:`Complete the facts about MCP.`,code:`MCP stands for Model ___ Protocol.
Local servers run as a process and talk over ___.
Remote servers are best connected over ___.`,blanks:[`Context`,`stdio`,`http`],wordBank:[`Context`,`stdio`,`http`,`Command`,`ftp`,`Control`],language:`text`,hint:`Local program on your machine = stdio. Server at a URL = http.`,explanation:`The transport depends on where the server runs: stdio for a program on your machine, http for one at a URL.`},{id:`u9-l1-e9`,type:`prompt-workshop`,scenario:"A read-only Postgres MCP server named `db` is connected. Signups dropped last week and you want Claude to investigate without changing anything.",files:[`src/signup/handler.ts`],sample:`Context: daily signups dropped sharply sometime last week, and the db MCP server is connected (read-only). Goal: find when the drop started and what might explain it. Use db to query daily signups for the last 14 days and show where the drop begins. Then read @src/signup/handler.ts and list recent logic that could explain it. Constraints: read-only queries only, and don't edit any code. Done when you report the query you ran, the first day of the drop, and up to 3 suspects with line numbers.`,keywords:[`signups`,`query`,`week`,`read-only`,`drop`],explanation:`Great MCP prompts name the server, the exact data to pull, what Claude must not touch, and what the finished report looks like.`}]},{id:`u9-l2`,title:`Adding & Managing Servers`,description:`claude mcp add, scopes and /mcp`,theory:[{title:`Reading claude mcp add`,body:'You add servers from your normal shell (not inside a Claude session). The shape is: `claude mcp add`, then any **options**, then a **name** you choose, then where the server is.\n\n**Remote server**: `--transport http` (short `-t http`), a name, then the URL.\n\n**Local stdio server**: a name, then `--`, then the command that launches the server. stdio is the default, so `--transport stdio` is optional. The `--` means "Claude\'s options end here": everything after it is handed to the server untouched, even things that look like flags, such as `--port 8080`.\n\n`npx @playwright/mcp@latest` is a launch command: `npx` runs a Node package without installing it for good, and `@latest` asks for the newest version.\n\nOptions like `--transport`, `--scope` and `-e KEY=value` (an environment variable, often a secret) go **before** the name.',code:`# remote:  claude mcp add --transport http <name> <url>
claude mcp add --transport http notion https://mcp.notion.com/mcp

# local:   claude mcp add <name> -- <launch command>
claude mcp add playwright -- npx @playwright/mcp@latest

# options first, then name, then url
claude mcp add --transport http --scope project notion https://mcp.notion.com/mcp`},{title:`Managing servers and scopes`,body:"Three shell commands manage what you've added: `claude mcp list` (all servers), `claude mcp get <name>` (one server's details), `claude mcp remove <name>` (delete it).\n\nInside a session, the slash command `/mcp` shows each server's status. Kip checks it for the word `connected`. Many remote servers need you to log in with **OAuth**: you pick the server in `/mcp`, a browser opens, you sign in there, and no password is ever pasted into Claude.\n\n`--scope` decides who gets a server: `local` (the default) is just you in this project; `project` writes it to `.mcp.json` at the repo root so the team shares it through git; `user` is just you, in every project.",code:`claude mcp list
claude mcp get notion
claude mcp remove notion

# inside a session
> /mcp`},{title:`Inside .mcp.json`,body:'A project-scoped server is saved as JSON in `.mcp.json`. Part by part:\n\n`"mcpServers"`: the one top-level key; every server lives inside it.\n\n`"notion"`: the server\'s name (the same name you gave `claude mcp add`).\n\n`"type": "http"`: the transport. `"url"`: where the remote server lives.\n\nA local server uses `"command"` and an `"args"` list instead of a URL.',code:`{
  "mcpServers": {
    "notion": {
      "type": "http",
      "url": "https://mcp.notion.com/mcp"
    },
    "playwright": {
      "command": "npx",
      "args": ["@playwright/mcp@latest"]
    }
  }
}`}],exercises:[{id:`u9-l2-e8`,type:`multiple-choice`,prompt:"In `claude mcp add myserver -- python server.py --port 8080`, what does the `--` do?",options:[`Comments out the rest of the line`,`Separates Claude's own options from the server's command and args`,`Runs the server in the background`,`Marks the server as project-scoped`],answer:1,explanation:"Without `--`, Claude would try to read `--port 8080` as its own option, so `--` hands everything after it to the server untouched."},{id:`u9-l2-e5`,type:`match-pairs`,prompt:`Match each scope to who gets the server.`,pairs:[{left:`--scope local`,right:`Just you, this project (default)`},{left:`--scope project`,right:`Whole team via .mcp.json`},{left:`--scope user`,right:`Just you, every project`}],explanation:`Pick the scope by who needs the server: only project scope writes a file the team receives through git.`},{id:`u9-l2-e6`,type:`fill-blank`,prompt:`Add Notion as a remote server and share it with your team.`,code:`claude mcp add ___ http ___ project notion https://mcp.notion.com/mcp`,blanks:[`--transport`,`--scope`],wordBank:[`--transport`,`--scope`,`--env`,`--header`,`--print`],language:`bash`,hint:`Options go before the name: --transport http picks the transport, --scope project shares it.`,explanation:"`--transport http` is needed because the server is at a URL, and `--scope project` saves it to `.mcp.json` so teammates get it too."},{id:`u9-l2-e7`,type:`fill-blank`,prompt:`Complete this project-scoped config file at the repo root.`,code:`// .mcp.json
{
  "___": {
    "shared-server": {
      "type": "___",
      "url": "https://example.com/mcp"
    }
  }
}`,blanks:[`mcpServers`,`http`],wordBank:[`mcpServers`,`http`,`servers`,`stdio`,`tools`],language:`json`,hint:`All servers live under one top-level key; a server with a url uses the remote transport.`,explanation:"Claude only looks for servers under `mcpServers`, and a server reached by `url` must use type `http` because it isn't a local program."},{id:`u9-l2-e9`,type:`order-steps`,prompt:`Put the steps for connecting a remote server that uses OAuth in order.`,steps:[`Run claude mcp add --transport http notion https://mcp.notion.com/mcp`,`Start a session with claude`,`Run /mcp and select the notion server`,`Finish the OAuth login in your browser`,`Confirm it shows connected, then ask Claude to use it`],explanation:"The server must be added from the shell before a session can see it, and OAuth login happens inside the session through `/mcp`."},{id:`u9-l2-e1`,type:`terminal`,prompt:"Add a local stdio MCP server named playwright whose launch command is `npx @playwright/mcp@latest`.",accepted:[`claude mcp add playwright -- npx @playwright/mcp@latest`,`claude mcp add --transport stdio playwright -- npx @playwright/mcp@latest`,`claude mcp add -t stdio playwright -- npx @playwright/mcp@latest`],hint:`claude mcp add <name> -- <launch command>`,explanation:"The name comes first and the launch command goes after `--`, so Claude knows which part to run as the server."},{id:`u9-l2-e2`,type:`terminal`,prompt:`Add GitHub's remote MCP server over HTTP. Name it github; its URL is https://api.githubcopilot.com/mcp/`,accepted:[`claude mcp add --transport http github https://api.githubcopilot.com/mcp/`,`claude mcp add -t http github https://api.githubcopilot.com/mcp/`],hint:`claude mcp add --transport http <name> <url>`,explanation:`A server at a URL isn't a local program, so you name the http transport and give the URL instead of a launch command.`},{id:`u9-l2-e3`,type:`terminal`,prompt:`From your shell, list every MCP server you've configured.`,accepted:[`claude mcp list`],hint:`claude mcp <subcommand>: the one that lists.`,explanation:"`claude mcp list` is the quick check that an add actually saved before you start a session."},{id:`u9-l2-e4`,type:`terminal`,prompt:`Inside a session, type the slash command that shows your servers' status and lets you log in to one that needs OAuth.`,promptSymbol:`>`,accepted:[`/mcp`],hint:`A slash followed by the protocol's three letters.`,explanation:"`/mcp` runs inside the session because that's where Claude actually connects to servers and can open the OAuth login."},{id:`u9-l2-e10`,type:`terminal`,prompt:`From your shell, remove the MCP server named notion.`,accepted:[`claude mcp remove notion`],hint:`claude mcp remove <name>`,explanation:`Removing a server you no longer use cuts off tools Claude doesn't need, and also clears its stored OAuth login.`}]}],xp={id:`u9-mission`,type:`mission`,title:`Plug In a Server`,intro:`Time to give Kip a new claw. Connect a real MCP server and make Claude use one of its tools.`,checklist:[`Add a trusted server, e.g. claude mcp add playwright -- npx @playwright/mcp@latest`,`Run claude mcp list to confirm it's configured`,`Start claude and run /mcp; make sure the server shows connected`,`Ask Claude to use one of its tools (e.g. open your local dev site and describe the page)`,`Run claude mcp get <name> to inspect its config`],bonusXp:30,badge:`mcp-explorer`,explanation:`Connecting a server and calling its tools is the core MCP loop you'll reuse for GitHub, databases and more.`},Sp=[{term:`MCP`,description:`Model Context Protocol: open standard connecting Claude to external tools and data.`,kind:`concept`},{term:`claude mcp add <name> -- <cmd>`,description:`Add a local stdio server; its launch command goes after --.`,kind:`command`},{term:`claude mcp add --transport http <name> <url>`,description:`Add a remote HTTP server (recommended for remote).`,kind:`command`},{term:`--scope local|project|user`,description:`Who gets the server; local is the default.`,kind:`flag`},{term:`-e KEY=value`,description:`Pass an environment variable to the server (also --env).`,kind:`flag`},{term:`claude mcp list`,description:`List all configured MCP servers.`,kind:`command`},{term:`claude mcp get <name>`,description:`Show details for one server.`,kind:`command`},{term:`claude mcp remove <name>`,description:`Remove a server's configuration.`,kind:`command`},{term:`/mcp`,description:`Check server status and authenticate with OAuth.`,kind:`slash`},{term:`.mcp.json`,description:`Project-scoped servers at the repo root, shared via git.`,kind:`file`},{term:`mcp__server__tool`,description:`How MCP tool names appear in permissions and rules.`,kind:`concept`}],Cp={id:`u9`,order:9,title:`MCP`,description:vp,color:yp,lessons:bp,mission:xp,cheatsheet:Sp},wp=s({cheatsheet:()=>Ap,color:()=>Dp,default:()=>jp,description:()=>Ep,id:()=>`u10`,lessons:()=>Op,mission:()=>kp,order:()=>10,title:()=>Tp}),Tp=`Git & Workflows`,Ep=`Commits, PRs, parallel worktrees and test-driven loops with Claude.`,Dp=`#f97316`,Op=[{id:`u10-l1`,title:`Commits & PRs`,description:`Let Claude handle the git chores`,theory:[{title:`Git in plain words`,body:`**Git** records the history of your project.

A **diff** is the list of lines added or removed since the last save. A **commit** is a saved snapshot of your changes, with a message saying what changed and why.

Before committing, you **stage** changes (\`git add\`): staging picks which edits go into the next commit.

A **branch** is a separate line of work. \`main\` is the shared one, so new work usually happens on its own branch. A **pull request (PR)** asks teammates to review your branch and merge it into \`main\`.`,code:`git diff            # changes NOT yet staged
git diff --staged   # changes staged for the next commit
                    # (--cached means the same thing)
git log --oneline   # commit history, one line each
gh pr create        # open a pull request (GitHub CLI)`},{title:`Claude speaks git`,body:"You don't need to remember git commands to use them with Claude. Ask in plain words, like the prompts below. Ask for a commit message that explains **why** the change was made, not just what changed.\n\nFor PRs, Claude uses the GitHub CLI, `gh`. Install it and run `gh auth login` once so it can act on your GitHub account.\n\nKip tip: Claude links the session to the PR it creates, so `claude --from-pr 123` finds that conversation later.",code:`> review the staged diff for bugs and missing tests
> commit with a message explaining why the change was made
> create a pr`},{title:`Review the diff before it ships`,body:"Claude's edits can look plausible and still be wrong. The diff is the ground truth of what changed, so read it yourself with `git diff --staged`, or ask Claude to **review the diff for bugs, edge cases and missing tests**.\n\nKeep work off `main`: ask for a new branch with a clear name like `fix/cart-total`. After Claude writes a PR, ask it to highlight risks you should double-check."}],exercises:[{id:`u10-l1-e1`,type:`multiple-choice`,prompt:`Which tool does Claude use to open GitHub pull requests from your terminal?`,options:[`The gh CLI`,`git push --pr`,`npm publish`,`A built-in /pr-open command`],answer:0,explanation:"Git itself knows nothing about pull requests, so Claude needs GitHub's own CLI, `gh`, installed and logged in."},{id:`u10-l1-e5`,type:`multiple-choice`,prompt:`Why review the diff before letting Claude commit?`,options:[`Git refuses commits without a review`,`Claude can't write commit messages without it`,`Edits can look plausible but be wrong; the diff shows exactly what changed`,`It makes the commit smaller`],answer:2,explanation:`The diff is the ground truth of what changed, so it's where you catch subtle mistakes before they enter history.`},{id:`u10-l1-e8`,type:`multiple-choice`,prompt:`Claude opened PR #1234 last week. How do you jump back to that session?`,options:[`claude --pr 1234`,`claude --from-pr 1234`,`/resume-pr 1234`,`gh pr claude 1234`],answer:1,explanation:"Claude links each session to the PR it created, so `claude --from-pr` can find that conversation by PR number."},{id:`u10-l1-e7`,type:`match-pairs`,prompt:`Match each command to what it does.`,pairs:[{left:`git diff`,right:`Show unstaged changes`},{left:`git diff --staged`,right:`Show staged changes`},{left:`git log --oneline`,right:`Compact commit history`},{left:`gh pr create`,right:`Open a pull request`}],explanation:`Inspect with diff, check history with log, and ship with gh: knowing which is which lets you verify what Claude did.`},{id:`u10-l1-e2`,type:`spot-bad-prompt`,prompt:`Claude just fixed a cart total bug and you want it shipped for review.`,options:[`Push everything to main.`,`Create a branch fix/cart-total, commit the fix with a message explaining the bug, and open a PR against main describing the change and how you tested it.`],better:1,explanation:`Pushing to main skips review entirely, while a branch plus a PR lets teammates check the change before it lands.`},{id:`u10-l1-e6`,type:`fill-blank`,prompt:`Complete this session's prompts.`,code:`> review the ___ diff for bugs and missing tests
> commit with a message explaining ___ the change was made
> create a ___`,blanks:[`staged`,`why`,`pr`],wordBank:[`staged`,`why`,`pr`,`global`,`never`,`lockfile`],language:`text`,hint:`Review what will be committed, ask for the reason behind it, then open a pull request.`,explanation:`The staged diff is exactly what the commit will contain, and a message that explains why helps future readers more than one that lists what.`},{id:`u10-l1-e3`,type:`order-steps`,prompt:`Order a careful ship-it flow with Claude.`,steps:[`Ask Claude to summarize the changes you made`,`Ask Claude to review the diff for bugs and missing tests`,`Ask Claude to commit with a descriptive message`,`Ask Claude to create a pr`,`Read the PR and ask Claude to flag any risks`],explanation:`Problems are cheapest to fix before the commit, so you summarize and review first and only then commit and open the PR.`},{id:`u10-l1-e4`,type:`terminal`,prompt:`In your shell, show the changes that are staged for the next commit.`,accepted:[`git diff --staged`,`git diff --cached`],hint:`git diff --staged`,explanation:"Plain `git diff` hides staged changes, so you add `--staged` to see exactly what the next commit will contain."},{id:`u10-l1-e9`,type:`prompt-workshop`,scenario:`Claude just fixed a timezone bug in the date parser and added tests. Write one prompt that gets the change reviewed, committed and opened as a PR.`,files:[`src/utils/date.ts`,`tests/date.test.ts`],sample:`Context: you just fixed the timezone bug in @src/utils/date.ts and added tests in @tests/date.test.ts. Goal: get this reviewed and opened as a PR. First review the diff for bugs or missing edge cases, then run the tests. Constraints: don't commit to main; use a new branch fix/date-timezone. If the tests pass, commit with a message explaining the timezone bug and create a pr that describes the fix and how it was tested. Done when the PR is open and you reply with its link and any risks I should double-check.`,keywords:[`diff`,`commit`,`pr`,`tests`,`timezone`],explanation:`A strong ship prompt chains review, verification, commit and PR in order, so nothing reaches reviewers untested.`}]},{id:`u10-l2`,title:`Worktrees & TDD Loops`,description:`Parallel sessions and test-first work`,theory:[{title:`Worktrees in plain words`,body:"Normally your project folder shows one branch at a time. A **git worktree** is an **extra folder** showing a different branch of the same repo. Files are separate; history (commits) is shared.\n\nRun one Claude session per worktree and they can't overwrite each other's edits. Kip runs three at once and never pinches his own claw.\n\nIn `git worktree add ../project-feature-a -b feature-a`: `add` creates a worktree, `../project-feature-a` is the new folder's path (`..` puts it next to your project), and `-b feature-a` creates a new branch with that name.\n\n`&&` joins two commands: run the second only if the first worked. The repo needs at least one commit first.",code:`# new folder ../project-feature-a on new branch feature-a
git worktree add ../project-feature-a -b feature-a

# go there, then start Claude
cd ../project-feature-a && claude

git worktree list                          # every worktree + its branch
git worktree remove ../project-feature-a   # clean up when done`},{title:`Let Claude Code make it`,body:"Shortcut: `claude --worktree <name>` (short `-w`) creates a worktree under `.claude/worktrees/` and starts Claude inside it, all in one command.\n\nWhen the work is finished: review it, commit it, and merge its branch (usually through a PR). Then remove the worktree so old folders don't pile up.",code:`claude --worktree feature-auth
# same thing
claude -w feature-auth`},{title:`The test-driven loop`,body:`A **test** is a small piece of code that checks your code gives the expected output. It **passes** (green) or **fails** (red). TDD means writing tests first. They give Claude a clear target it can check itself.

**1.** Ask Claude to write tests from concrete examples, and say you're doing TDD so it doesn't write the implementation yet.

**2.** Run them and confirm they **fail**. A test that already passes isn't checking anything new. Commit the tests.

**3.** Ask Claude to write code that makes them pass **without modifying the tests**, iterating until green.

**4.** Commit the code.`,code:`> we're doing TDD. write tests for slugify():
  'Hello World' -> 'hello-world'. no implementation yet
> run the tests and confirm they fail, then commit them
> implement slugify until the tests pass. don't modify the tests`}],exercises:[{id:`u10-l2-e5`,type:`multiple-choice`,prompt:`Why use worktrees for parallel Claude sessions?`,options:[`They make Claude respond faster`,`Each has independent files but shared history, so sessions don't overwrite each other`,`They merge branches automatically`,`They let two sessions share one context window`],answer:1,explanation:`Two sessions editing one folder would clobber each other's files, while separate worktrees keep files apart and commits in one repo.`},{id:`u10-l2-e9`,type:`multiple-choice`,prompt:`Mid-loop, Claude suggests changing a test's expected value so it passes. What should you usually do?`,options:[`Accept it; green is green`,`Delete the test`,`Tell Claude to keep the tests unchanged and fix the implementation`,`Run /clear and start over`],answer:2,explanation:`The tests encode what the code should do, so editing them to pass hides the bug instead of fixing it.`},{id:`u10-l2-e8`,type:`spot-bad-prompt`,prompt:`You want to build slugify() test-first.`,options:[`Write tests in tests/slugify.test.ts for slugify(): 'Hello World' -> 'hello-world', '  Trim me  ' -> 'trim-me', '' -> ''. We're doing TDD, so don't write the implementation yet. Run the tests and confirm they fail.`,`Write slugify and some tests for it.`],better:0,explanation:`Concrete input/output pairs define the target, and 'no implementation yet' stops Claude writing tests that just match its own code.`},{id:`u10-l2-e6`,type:`fill-blank`,prompt:`Complete the worktree lifecycle.`,code:`git worktree ___ ../app-bugfix -b bugfix
cd ../app-bugfix && claude
git worktree ___
git worktree ___ ../app-bugfix`,blanks:[`add`,`list`,`remove`],wordBank:[`add`,`list`,`remove`,`checkout`,`clone`,`stash`],language:`bash`,hint:`git worktree add <path> -b <branch>, then list, then remove <path>.`,explanation:`A worktree's life is create, use, check, clean up, and each step is a git worktree subcommand: add, list, remove.`},{id:`u10-l2-e1`,type:`order-steps`,prompt:`Order the steps to run a parallel Claude session in a worktree.`,steps:[`git worktree add ../project-feature-a -b feature-a`,`cd ../project-feature-a`,`Run claude and give it the feature task`,`Review, commit and merge the feature-a branch`,`git worktree remove ../project-feature-a`],explanation:`The folder must exist before you can work in it, and you remove it only after its branch is merged so no work is lost.`},{id:`u10-l2-e7`,type:`order-steps`,prompt:`Order the test-driven loop with Claude.`,steps:[`Ask Claude to write tests from expected inputs and outputs, no implementation`,`Run the tests and confirm they fail`,`Commit the tests`,`Ask Claude to write code that passes without changing the tests`,`Iterate until green, then commit the code`],explanation:`Seeing the tests fail first proves they check something, and committing them locks the target before any code is written.`},{id:`u10-l2-e2`,type:`terminal`,prompt:`Create a worktree in the folder ../project-feature-a on a new branch named feature-a.`,accepted:[`git worktree add ../project-feature-a -b feature-a`,`git worktree add -b feature-a ../project-feature-a`],hint:`git worktree add <path> -b <branch>`,explanation:"`-b` creates a fresh branch for the new folder, so its work stays separate from the branch you're on."},{id:`u10-l2-e3`,type:`terminal`,prompt:`Start Claude in an isolated worktree named feature-auth, letting Claude Code create the worktree for you.`,accepted:[`claude --worktree feature-auth`,`claude -w feature-auth`],hint:`claude --worktree <name>`,explanation:"`--worktree` creates the folder and starts Claude in it in one step, so you skip the manual add and cd."},{id:`u10-l2-e4`,type:`terminal`,prompt:`List all worktrees for this repository.`,accepted:[`git worktree list`],hint:`git worktree <subcommand>: the one that lists.`,explanation:"With several parallel sessions it's easy to lose track, and `git worktree list` shows every folder and its branch."},{id:`u10-l2-e10`,type:`prompt-workshop`,scenario:`You need parseDuration("1h30m") to return 5400 (seconds). Kick off a TDD loop with Claude.`,files:[`src/time.ts`,`tests/time.test.ts`],sample:`Context: we need parseDuration in @src/time.ts to turn strings like "1h30m" into seconds, and we're doing TDD. Goal: write tests in @tests/time.test.ts first: "1h30m" -> 5400, "45s" -> 45, "2h" -> 7200, and invalid input throws. Constraints: don't write the implementation yet. Run the tests, confirm they fail, and commit them. Then implement parseDuration without modifying the tests. Done when every test passes and the implementation is committed separately from the tests.`,keywords:[`tests`,`fail`,`parseDuration`,`implementation`,`commit`],explanation:`Concrete examples, a tests-first rule and a 'don't modify tests' constraint give Claude a target it can't quietly move.`}]}],kp={id:`u10-mission`,type:`mission`,title:`Ship It From a Worktree`,intro:`Spin up a parallel workspace, drive a tiny feature test-first, and ship it as a real PR.`,checklist:[`Create a worktree: claude --worktree tiny-feature (or git worktree add ../repo-tiny -b tiny-feature)`,`Ask Claude to write failing tests for a small function, run them, and commit the tests`,`Have Claude implement the function until the tests pass without touching the tests`,`Ask Claude to review the git diff, then commit with a descriptive message`,`With gh installed and logged in, ask Claude to create a pr`],bonusXp:30,badge:`git-pilot`,explanation:`Worktree isolation, a TDD loop and a reviewed PR are the core of a safe Claude git workflow.`},Ap=[{term:`"create a pr"`,description:`Ask Claude to open a pull request via the gh CLI.`,kind:`concept`},{term:`gh auth login`,description:`Authenticate the GitHub CLI so Claude can create PRs.`,kind:`command`},{term:`git diff --staged`,description:`Show staged changes; review before committing.`,kind:`command`},{term:`claude --from-pr <number>`,description:`Find sessions linked to a pull request.`,kind:`flag`},{term:`git worktree add <path> -b <branch>`,description:`Create a separate checkout on a new branch.`,kind:`command`},{term:`claude --worktree <name>`,description:`Start Claude in a new isolated worktree (short: -w).`,kind:`flag`},{term:`git worktree list`,description:`Show all worktrees and their branches.`,kind:`command`},{term:`git worktree remove <path>`,description:`Delete a worktree when you're done.`,kind:`command`},{term:`TDD loop`,description:`Write failing tests, commit them, implement until green without editing tests.`,kind:`concept`}],jp={id:`u10`,order:10,title:Tp,description:Ep,color:Dp,lessons:Op,mission:kp,cheatsheet:Ap},Mp=s({cheatsheet:()=>Rp,color:()=>Fp,default:()=>zp,description:()=>Pp,id:()=>`u11`,lessons:()=>Ip,mission:()=>Lp,order:()=>11,title:()=>Np}),Np=`Headless & Automation`,Pp=`Run Claude without the chat UI: claude -p, output formats, pipes, scripts and CI.`,Fp=`#22d3ee`,Ip=[{id:`u11-l1`,title:`claude -p Basics`,description:`One prompt in, one answer out`,theory:[{title:`Print mode`,body:'`claude -p "query"` (long form `--print`) runs Claude **non-interactively**: it does the task, prints the result, and exits. No chat window, no follow-up questions. Kip calls this "going headless" (the shell stays on).\n\nPut the prompt in quotes right after `-p` so the shell passes it as one piece of text.\n\nAdd `-c` (long form `--continue`) to send a follow-up to your **most recent conversation** instead of starting a new one.\n\nWhen it finishes, `claude -p` gives an **exit code**: `0` means success, anything else means it failed. Scripts check this number to decide what to do next.',code:`# one question, one answer
claude -p "What does the auth module do?"

# follow up in the most recent conversation
claude -c -p "Now check for type errors"`},{title:`Pipes and redirects`,body:'Command-line programs read input (**stdin**) and write output (**stdout**). Three symbols wire them together:\n\n`|` (pipe): send the output of the command on the left into the command on the right. `cat logs.txt` prints a file, so `cat logs.txt | claude -p "..."` hands that file to Claude.\n\n`< file`: feed a file in as input. Same effect as `cat file |`.\n\n`> file`: save the output to a file instead of printing it.',code:`# pipe a file in
cat build-error.txt | claude -p "explain the root cause"

# same thing with <
claude -p "explain the root cause" < build-error.txt

# save the answer to output.txt
cat build-error.txt | claude -p "explain the root cause" > output.txt`},{title:`Output formats and jq`,body:"`--output-format` picks the shape of the output:\n\n`text` (default): plain text for humans.\n\n`json`: one JSON object. The answer is in the `result` field; there's also `session_id` and `total_cost_usd` (estimated spend).\n\n`stream-json`: one JSON event per line, live as the run happens (pair it with `--verbose`).\n\n`--json-schema` goes further: Claude's output is validated against a JSON schema you provide.\n\n`jq` is a small tool that pulls fields out of JSON: `jq -r '.result'` prints just the `result` field (`.result`), as raw text without quotes (`-r`).",code:`# the json output looks roughly like
{ "result": "This project is...", "session_id": "...", "total_cost_usd": 0.01 }

# keep only the answer text
claude -p "Summarize this project" --output-format json | jq -r '.result'`}],exercises:[{id:`u11-l1-e3`,type:`multiple-choice`,prompt:`Which output format streams newline-delimited JSON events in real time?`,options:[`text`,`json`,`stream-json`,`ndjson`],answer:2,explanation:"`stream-json` sends each event as it happens, so a script can show progress instead of waiting for the final answer."},{id:`u11-l1-e7`,type:`multiple-choice`,prompt:"In `--output-format json`, which field reports the estimated spend for the run?",options:[`price`,`total_cost_usd`,`tokens_spent`,`bill`],answer:1,explanation:"JSON output carries metadata like `total_cost_usd` next to the answer, so scripts can track spend without parsing text."},{id:`u11-l1-e8`,type:`multiple-choice`,prompt:"How can a shell script tell whether a `claude -p` run failed?",options:[`Parse the word 'error' from the output`,`Check the exit code: 0 on success, non-zero on failure`,`It can't; claude -p always succeeds`,`Read ~/.claude/last-run.txt`],answer:1,explanation:`Exit codes are how every command-line program reports success, so checking for 0 is more reliable than reading the text.`},{id:`u11-l1-e5`,type:`match-pairs`,prompt:`Match each flag value to what you get.`,pairs:[{left:`--output-format text`,right:`Plain text (the default)`},{left:`--output-format json`,right:`One JSON object with metadata`},{left:`--output-format stream-json`,right:`Newline-delimited JSON events`},{left:`--json-schema`,right:`Output validated against a schema`}],explanation:`Pick by who reads the output: text for humans, json for scripts, stream-json for live progress, --json-schema for a guaranteed shape.`},{id:`u11-l1-e9`,type:`spot-bad-prompt`,prompt:`A script pipes a failed build log into Claude and saves the answer for the team.`,options:[`cat build.log | claude -p "help"`,`cat build.log | claude -p "concisely explain the root cause of this build error and name the file to fix"`],better:1,explanation:`Nobody can answer follow-up questions in a script, so the prompt itself must say exactly what output you want.`},{id:`u11-l1-e4`,type:`fill-blank`,prompt:`Get JSON output and extract just the answer text with jq.`,code:`claude -p "Summarize this project" --output-format ___ | jq -r '.___'`,blanks:[`json`,`result`],wordBank:[`json`,`result`,`text`,`output`,`yaml`,`answer`],language:`bash`,hint:`--output-format json, then jq -r '.<field>' where the answer field is named result.`,explanation:"jq can only read JSON, so you ask for json output and then pick the `result` field, which is where the answer lives."},{id:`u11-l1-e1`,type:`terminal`,prompt:`Run Claude non-interactively with the prompt "summarize this project" (include the quotes).`,accepted:[`claude -p "summarize this project"`,`claude --print "summarize this project"`],hint:`claude -p "<prompt>"`,explanation:"`-p` makes Claude answer once and exit, which is what lets it run inside scripts with nobody watching."},{id:`u11-l1-e2`,type:`terminal`,prompt:`Use a pipe to send the contents of logs.txt into Claude with the prompt "explain these errors".`,accepted:[`cat logs.txt | claude -p "explain these errors"`,`cat logs.txt | claude --print "explain these errors"`,`claude -p "explain these errors" < logs.txt`,`claude --print "explain these errors" < logs.txt`],hint:`cat <file> | claude -p "<prompt>"`,explanation:`Print mode reads stdin, so whatever you pipe in becomes part of what Claude sees alongside your prompt.`},{id:`u11-l1-e6`,type:`terminal`,prompt:`Continue your most recent conversation headlessly with the prompt "Now focus on the database queries".`,accepted:[`claude -c -p "Now focus on the database queries"`,`claude --continue -p "Now focus on the database queries"`,`claude -c --print "Now focus on the database queries"`,`claude --continue --print "Now focus on the database queries"`,`claude -p "Now focus on the database queries" --continue`,`claude -p "Now focus on the database queries" -c`],hint:`claude -c -p "<prompt>"`,explanation:"`-c` keeps the earlier conversation as context, so a script can build on a previous answer instead of starting over."}]},{id:`u11-l2`,title:`Scripts & CI`,description:`Guardrails, flags and GitHub Actions`,theory:[{title:`Guardrails for unattended runs`,body:'Nobody is around to click "allow" in a script, so decide permissions up front:\n\n`--allowedTools "Bash,Read,Edit"`: these tools run without asking. You can narrow one with a rule like `Bash(git diff *)`. `--disallowedTools` denies or removes tools.\n\n`--max-turns 3`: stop after 3 agentic turns (print mode only), so a run can\'t go on forever.\n\n`--append-system-prompt "..."`: **adds** your instructions and keeps Claude Code\'s default system prompt. `--system-prompt` **replaces** the default entirely.\n\n`--bare`: skip auto-discovered hooks, plugins, MCP servers and CLAUDE.md for reproducible CI runs.\n\nUse `--dangerously-skip-permissions` only inside an isolated container.',code:`claude -p "Run the test suite and fix any failures" --allowedTools "Bash,Read,Edit"

claude -p "fix the lint errors" --max-turns 3`},{title:`Reading a script`,body:'A few shell pieces show up in scripts:\n\n`\\` at the end of a line: the command continues on the next line. It\'s just for readability.\n\n`"$1"`: the first argument given to the script. Run `./review.sh 42` and `$1` is `42`.\n\n`gh pr diff 42`: print the diff of pull request 42 (GitHub CLI).\n\n`2>&1`: also send error messages into the pipe. Test runners often print failures as errors, which a plain `|` would skip.',code:`# review.sh: run as ./review.sh 42
gh pr diff "$1" | claude -p \\
  --append-system-prompt "You are a test engineer. List missing tests." \\
  --output-format json

# include error output in the pipe
npm test 2>&1 | claude -p "summarize the failures"`},{title:`Claude in GitHub Actions`,body:"The `anthropics/claude-code-action` runs Claude in GitHub's automation (workflows). Mention `@claude` in an issue or PR comment and it gets to work.\n\nFastest setup: run `/install-github-app` inside a session. It installs the Claude GitHub App, saves your key as a repo secret (like `ANTHROPIC_API_KEY`), and prepares the workflow PR.\n\nWorkflows are written in **YAML**: `key: value` pairs, where indentation shows what belongs inside what, and `- ` starts a list item. `uses:` names the action as `owner/name@version`. `with:` gives it inputs. `${{ secrets.NAME }}` inserts a secret without writing it in the file. CLI flags go in `claude_args`.",code:`- uses: anthropics/claude-code-action@v1   # which action, version 1
  with:                                     # its inputs:
    anthropic_api_key: \${{ secrets.ANTHROPIC_API_KEY }}
    claude_args: "--max-turns 5"            # normal CLI flags`}],exercises:[{id:`u11-l2-e4`,type:`multiple-choice`,prompt:"How does `--append-system-prompt` differ from `--system-prompt`?",options:[`They're identical aliases`,`Append keeps Claude Code's default prompt and adds yours; --system-prompt replaces it entirely`,`Append only works in interactive mode`,`--system-prompt adds text to the end of every user message`],answer:1,explanation:`Appending keeps the default tool and safety guidance Claude relies on, while replacing drops all of it.`},{id:`u11-l2-e7`,type:`multiple-choice`,prompt:"When is `--dangerously-skip-permissions` reasonable?",options:[`On your laptop, to save time`,`In any CI job`,`Inside an isolated container or sandbox with nothing valuable to damage`,`Whenever the repo has tests`],answer:2,explanation:`It skips every permission check, so it's only safe where a mistake can't reach real files, systems or secrets.`},{id:`u11-l2-e5`,type:`match-pairs`,prompt:`Match each flag to its job in a script.`,pairs:[{left:`--allowedTools`,right:`Pre-approve specific tools`},{left:`--disallowedTools`,right:`Deny or remove tools`},{left:`--max-turns`,right:`Cap agentic turns`},{left:`--bare`,right:`Skip local config, start faster`},{left:`--append-system-prompt`,right:`Add extra system instructions`}],explanation:`With no human watching, these flags decide in advance what Claude may do, for how long, and under which instructions.`},{id:`u11-l2-e3`,type:`fill-blank`,prompt:`Complete review.sh: security-review a PR diff and return JSON.`,code:`gh pr diff "$1" | claude ___ \\
  --___ "You are a security engineer. Review for vulnerabilities." \\
  --output-format ___`,blanks:[`-p`,`append-system-prompt`,`json`],wordBank:[`-p`,`append-system-prompt`,`json`,`-w`,`max-turns`,`markdown`],language:`bash`,hint:`Same shape as review.sh in the theory: claude -p, --append-system-prompt "role", --output-format json.`,explanation:"`-p` is what lets Claude read the piped diff, the appended prompt sets the reviewer role, and json makes the result easy for scripts to use."},{id:`u11-l2-e9`,type:`fill-blank`,prompt:`Complete the workflow step.`,code:`- uses: anthropics/___@v1
  with:
    anthropic_api_key: \${{ secrets.ANTHROPIC_API_KEY }}
    claude_args: "--___ 5"`,blanks:[`claude-code-action`,`max-turns`],wordBank:[`claude-code-action`,`max-turns`,`claude-cli`,`setup-claude`,`max-tokens`],language:`yaml`,hint:`uses: owner/name@version. claude_args holds normal CLI flags, like the one that caps turns.`,explanation:"`uses` must name the real action, anthropics/claude-code-action, and claude_args takes the same flags as the CLI, so --max-turns caps the run."},{id:`u11-l2-e8`,type:`order-steps`,prompt:`Order the quick setup for @claude in GitHub.`,steps:[`Install the gh CLI and run gh auth login`,`Open claude in the repo and run /install-github-app`,`Let it install the Claude GitHub App and save the secret`,`Create and merge the workflow pull request it prepares`,`Mention @claude in an issue or PR comment`],explanation:`The setup talks to GitHub through gh, and the workflow only runs once its PR is merged, so @claude comes last.`},{id:`u11-l2-e1`,type:`terminal`,prompt:`Headlessly run the prompt "Run the test suite and fix any failures", pre-approving the tools "Bash,Read,Edit" (keep both quoted).`,accepted:[`claude -p "Run the test suite and fix any failures" --allowedTools "Bash,Read,Edit"`,`claude --print "Run the test suite and fix any failures" --allowedTools "Bash,Read,Edit"`,`claude -p "Run the test suite and fix any failures" --allowed-tools "Bash,Read,Edit"`,`claude --print "Run the test suite and fix any failures" --allowed-tools "Bash,Read,Edit"`],hint:`claude -p "<prompt>" --allowedTools "<Tool,Tool,Tool>"`,explanation:"A script can't answer permission prompts, so `--allowedTools` approves the needed tools before the run starts."},{id:`u11-l2-e2`,type:`terminal`,prompt:`Headlessly run the prompt "fix the lint errors", limited to 3 agentic turns.`,accepted:[`claude -p "fix the lint errors" --max-turns 3`,`claude --print "fix the lint errors" --max-turns 3`],hint:`claude -p "<prompt>" --max-turns <N>`,explanation:`Capping turns stops an unattended run that's going in circles before it burns time and money.`},{id:`u11-l2-e6`,type:`terminal`,prompt:`Inside a session, type the slash command that starts the quick setup for Claude in GitHub Actions.`,promptSymbol:`>`,accepted:[`/install-github-app`],hint:`/install-<platform>-app`,explanation:"`/install-github-app` does the app install, secret and workflow PR for you, so you don't have to write the YAML by hand."},{id:`u11-l2-e10`,type:`prompt-workshop`,scenario:"A nightly CI job pipes `npm test` output into `claude -p`. Write the prompt so the report is useful with nobody around to ask follow-ups.",files:[`package.json`],sample:`npm test 2>&1 | claude -p "Context: these are tonight's CI test results; the test script is defined in package.json. Goal: for each failing test, give the test name, the likely root cause in one sentence, and the file to look at. Constraints: don't edit any files; output Markdown bullets only, no intro text. Done: one bullet per failing test, or if every test passed, print exactly: ALL GREEN"`,keywords:[`failing`,`root cause`,`file`,`output`,`test`],explanation:`Nobody can ask follow-ups in CI, so a headless prompt must define the exact output, including what to print when there's nothing to report.`}]}],Lp={id:`u11-mission`,type:`mission`,title:`Go Headless`,intro:`Kip unplugs the chat window. Make Claude work as a plain command-line tool in your own scripts.`,checklist:[`Run claude -p "summarize this project" in a repo`,`Pipe input: git log --oneline -20 | claude -p "summarize these recent commits"`,`Run a prompt with --output-format json and pipe it to jq -r '.result'`,`Run a guarded task with --allowedTools "Read" --max-turns 3`,`Optional: run /install-github-app in a repo you admin`],bonusXp:30,badge:`headless-hero`,explanation:`Print mode, pipes, JSON output and guardrail flags are the building blocks of every Claude automation.`},Rp=[{term:`claude -p "query"`,description:`Run one prompt non-interactively, print, exit (also --print).`,kind:`command`},{term:`cat file | claude -p "query"`,description:`Pipe content into Claude via stdin.`,kind:`command`},{term:`claude -c -p "query"`,description:`Continue the most recent conversation headlessly.`,kind:`command`},{term:`--output-format text|json|stream-json`,description:`Plain text, one JSON object, or streamed JSON events.`,kind:`flag`},{term:`--allowedTools`,description:`Pre-approve tools, e.g. "Read,Edit,Bash(git diff *)".`,kind:`flag`},{term:`--disallowedTools`,description:`Deny or remove tools for the run.`,kind:`flag`},{term:`--max-turns N`,description:`Limit agentic turns in print mode.`,kind:`flag`},{term:`--append-system-prompt`,description:`Add instructions while keeping the default system prompt.`,kind:`flag`},{term:`--bare`,description:`Skip auto-discovered config for faster, reproducible scripted runs.`,kind:`flag`},{term:`/install-github-app`,description:`Set up Claude in GitHub Actions for this repo.`,kind:`slash`},{term:`@claude`,description:`Mention in an issue or PR comment to trigger the action.`,kind:`concept`}],zp={id:`u11`,order:11,title:Np,description:Pp,color:Fp,lessons:Ip,mission:Lp,cheatsheet:Rp},Bp=s({cheatsheet:()=>Kp,color:()=>Up,default:()=>qp,description:()=>Hp,id:()=>`u12`,lessons:()=>Wp,mission:()=>Gp,order:()=>12,title:()=>Vp}),Vp=`Pro Habits`,Hp=`Explore, plan, code, commit; verify everything; course-correct early and rewind without fear.`,Up=`#ffc83d`,Wp=[{id:`u12-l1`,title:`Explore → Plan → Code → Commit`,description:`The loop the pros run`,theory:[{title:`Four phases, in order`,body:`Letting Claude jump straight to code can solve the wrong problem. Split the work:

**Explore**: Claude reads the relevant files and answers questions, no edits yet. **Plan mode** keeps it read-only. Turn it on by pressing \`Shift+Tab\` (cycles the permission modes) until the status bar shows plan mode on, or start with \`claude --permission-mode plan\`.

**Plan**: ask for a detailed implementation plan and fix it before any code exists.

**Code**: switch out of plan mode and implement, then **verify** with tests or checks.

**Commit**: commit with a descriptive message and open a PR.

Skip the plan for tiny changes: if you could describe the diff in one sentence, just ask.`,code:`$ claude --permission-mode plan      # or press Shift+Tab mid-session
> read @src/auth and explain how login works. don't change anything yet
> I want to add Google OAuth. what files change? create a plan
> implement the plan, write tests for the callback, run them and fix failures
> commit with a descriptive message and open a PR`},{title:`Give Claude a way to check itself`,body:`Claude stops when the work *looks* done. Give it something that returns pass or fail and it can iterate on its own:

**Tests**: behavior matches the spec. **Build** exit code: the project still compiles. **Linter**: style and suspicious patterns. **Type checker**: type mismatches. **Screenshot** vs a design mock: the UI matches.

So instead of "be careful", give concrete example cases and say "run the tests after implementing".

Work in **small, verifiable steps**: each one gets checked (and ideally committed) before the next. Kip never climbs to a new shell without testing the fit.`}],exercises:[{id:`u12-l1-e2`,type:`multiple-choice`,prompt:`During the Explore phase, what should you tell Claude?`,options:[`Implement the feature as fast as possible`,`Read the relevant files and explain them, but don't write any code yet`,`Commit everything first`,`Delete unused files`],answer:1,explanation:`Exploring without edits means Claude understands the code before it changes anything, which is exactly what plan mode enforces.`},{id:`u12-l1-e4`,type:`multiple-choice`,prompt:`When is it fine to skip the planning step?`,options:[`Never; always plan`,`When the change touches many files`,`When the change is small and clear, like fixing a typo or renaming a variable`,`When you're unfamiliar with the code`],answer:2,explanation:`Planning costs time, so it only pays off when the change is big or unclear; a one-sentence diff can just be asked for.`},{id:`u12-l1-e7`,type:`multiple-choice`,prompt:`Which gives Claude the strongest way to verify a new validateEmail function?`,options:[`Asking it to be extra careful`,`Example cases plus 'run the tests after implementing'`,`A longer CLAUDE.md`,`Using a bigger model`],answer:1,explanation:`Runnable test cases turn 'looks done' into a real pass/fail signal, which 'be careful' or a bigger model can't provide.`},{id:`u12-l1-e5`,type:`match-pairs`,prompt:`Match each check to what it verifies.`,pairs:[{left:`Unit tests`,right:`Behavior matches the spec`},{left:`Screenshot vs mock`,right:`UI matches the design`},{left:`Linter`,right:`Style and suspicious patterns`},{left:`Type checker`,right:`Type mismatches`},{left:`Build exit code`,right:`Project still compiles`}],explanation:`Each check returns a pass or fail Claude can read, which lets it fix its own mistakes instead of stopping when work merely looks done.`},{id:`u12-l1-e6`,type:`spot-bad-prompt`,prompt:`You want Claude to implement a dashboard design from a mock.`,options:[`Make the dashboard look better.`,`[Image #1] is the design. Implement it in src/Dashboard.tsx, take a screenshot of the result, compare it to the mock, list the differences, and fix them.`],better:1,explanation:`A screenshot compared to the mock gives Claude a concrete way to check its own work instead of guessing what 'better' means.`},{id:`u12-l1-e3`,type:`fill-blank`,prompt:`Two ways into read-only plan mode.`,code:`$ claude --permission-mode ___
